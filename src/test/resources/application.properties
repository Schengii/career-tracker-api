spring.application.name=career-tracker-api-test
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100
# test-only value, never used outside the test classpath
app.jwt.secret=test-only-secret-test-only-secret-0123456789
app.jwt.expiration=PT1H
app.jwt.refresh-expiration=P7D

# Brute-force protection for the login endpoint (per client IP + username)
app.login.max-attempts=5
app.login.window=PT15M
