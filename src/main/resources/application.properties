spring.application.name=career-tracker-api
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100
springdoc.swagger-ui.path=/swagger-ui.html

# Provide a secret of at least 32 bytes via the JWT_SECRET environment variable.
# If unset, a random key is generated at startup (development only).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT1H
app.jwt.refresh-expiration=P7D

# Brute-force protection for the login endpoint (per client IP + username)
app.login.max-attempts=5
app.login.window=PT15M
